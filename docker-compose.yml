services:
  stats-server:
    build:
      # Контекст — корень репозитория: stats-service зависит от stats-common
      # и наследует корневой pom.
      context: .
      dockerfile: stats-parent/stats-service/Dockerfile
    image: ewm-stats-service:latest
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/ewm_stats
      SPRING_DATASOURCE_USERNAME: dbuser
      # $$ — экранирование $ для compose, в контейнер уходит Qwerty$4.
      SPRING_DATASOURCE_PASSWORD: "Qwerty$$4"
    depends_on:
      stats-db:
        condition: service_healthy
    restart: unless-stopped

  stats-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_stats
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: "Qwerty$$4"
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d ewm_stats"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ewm-service:
    # TODO: снять profiles, когда сервис будет готов подниматься в CI
    # (свой datasource на ewm-db, схема, порт 8080).
    # Пока он не стартует, а CI на ветке stat_svc делает `docker compose up --detach`
    # без аргументов — без профиля шаг падал бы на запуске ewm-service.
    profiles: ["main"]
    build:
      context: .
      dockerfile: ewm-main-service/Dockerfile
    image: ewm-main-service:latest
    ports:
      - "8080:8080"

  ewm-db:
    profiles: ["main"]
    image: postgres:16.1

volumes:
  stats-db-data:
